          - "Ты на работе ещё? Я думал уже дома."
        kk:
          - "Қалайсың? Анам кеше хабарласты, кездестік деді."
      victim:
        ru: ["Нормально всё. А ты как?", "Да только вышел. А что?"]
        kk: ["Жақсы. Өзің қалайсың?", "Жаңа шықтым. Не болды?"]
    S2:
      caller:
        ru:
