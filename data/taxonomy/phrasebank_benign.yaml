      # flag_bearing: секретность и невозможность перезвонить — но безобидные
      caller_flag_bearing:
        ru:
          - "Только маме пока не говори, я хочу сюрприз на юбилей сделать."
          - "Перезвонить не смогу, у меня телефон садится, я с чужого звоню."
          - "Надо сегодня до шести, иначе место в общаге отдадут другому."
          - "Никому не говори пока, я сам расскажу, когда всё решится."
        kk:
          - "Анама әзірше айтпа, мен той сыйлығын дайындап жүрмін."
          - "Қайта қоңырау шала алмаймын, телефоным отырып қалды."
          - "Бүгін алтыға дейін керек, әйтпесе орынды басқаға береді."
      victim:
        ru: ["Сколько надо?", "А что случилось-то?", "Ладно, сейчас скину.",
             "Давай я маме наберу сначала.", "Погоди, а ты точно это ты?"]
        kk: ["Қанша керек?", "Не болды?", "Жарайды, қазір жіберемін.",
             "Тоқта, анама хабарласайын."]
    SB:
      caller:
        ru:
          - "Позвони маме, она в курсе, я ей вчера говорил."
          - "Могу скрин квитанции скинуть, посмотри сам."
          - "Да не срочно, если неудобно — займу у Ержана."
          - "Конечно, перезвони мне сам, если сомневаешься."
          - "Давай завтра, я всё равно к вам заеду в выходные."
        kk:
          - "Анама қоңырау шал, ол біледі."
          - "Түбіртектің скринін жіберейін, өзің қара."
          - "Шұғыл емес, ыңғайсыз болса — Ержаннан сұраймын."
          - "Күмәнданасың ба — өзің қайта қоңырау шал."
