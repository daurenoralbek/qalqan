        ru: ["Да, сейчас спущусь.", "Оставьте у двери, пожалуйста.", "Иду."]
        kk: ["Иә, қазір түсемін.", "Есіктің алдына қалдырыңыз."]
    SB:
      caller:
        ru: ["Могу оставить у консьержа, если неудобно.", "Хорошо, жду пять минут."]
        kk: ["Консьержге қалдыра аламын.", "Жақсы, бес минут күтемін."]
      victim:
        ru: ["Спасибо!", "Хорошо, спасибо."]
        kk: ["Рахмет!", "Жақсы, рахмет."]

  # ═══════════════════════════════════════════════════════════════════
