# Қалқан — банк реплик ЛЕГИТИМНЫХ звонков
#
# Задача этих диалогов: научить модель отличать «разговор про деньги и срочность»
# от мошенничества.
#
# КЛЮЧЕВОЙ ПРИНЦИП — flag_bearing реплики.
# Если красные флаги встречаются только в мошенническом классе, модель выучит
# ключевые слова, а не смысл, и посыплется на проде. Поэтому часть легитимных
# реплик НАМЕРЕННО содержит поверхностные маркеры (срочность, секретность,
# упоминание кода, невозможность перезвонить, угроза отключения услуги) —
# в контексте, где они безобидны:
#     «не говори маме, я сюрприз готовлю»          → secrecy_demand, но benign
#     «перезвонить не смогу, телефон садится»      → no_callback, но benign
#     «код для получения 4471, я вам его называю»  → упоминание кода, но benign
# Именно эти примеры заставляют модель смотреть на контекст, а не на словарь.
#
# Стадии: S0 контакт, S1 подтверждение, S2 суть обращения, SB легитимное закрытие.

schema_version: "3.0"

scenarios:

  # ═══════════════════════════════════════════════════════════════════
  BN01:  # Настоящий банк подтверждает операцию
    S0:
      caller:
        ru:
          - "Здравствуйте, {victim_name} {patronymic}. {bank}, отдел мониторинга операций."
          - "Добрый день, это {bank}. Звоню по операции на вашей карте."
          - "{victim_name} {patronymic}, здравствуйте, {bank}, служба мониторинга."
        kk:
          - "Сәлеметсіз бе, {victim_name}. {bank}, операциялар мониторингі бөлімі."
          - "Қайырлы күн, бұл {bank}. Картаңыздағы операция бойынша хабарласып тұрмын."
      victim:
        ru: ["Здравствуйте.", "Да, слушаю.", "Алло, да.", "Здравствуйте, а что такое?"]
        kk: ["Сәлеметсіз бе.", "Иә, тыңдап тұрмын.", "Алло, иә."]
    S1:
      caller:
        ru:
          - "Карта оканчивается на {card_last4}. Сразу скажу: коды и пароли я спрашивать не буду."
          - "Уточню, вы сейчас в {city}? Подтверждать ничего не нужно, просто да или нет."
        kk:
          - "Картаңыздың соңы {card_last4}. Бірден айтайын: кодтар мен құпиясөздерді сұрамаймын."
      victim:
        ru: ["Да, всё верно.", "Да, в {city}.", "А откуда мне знать, что вы из банка?"]
        kk: ["Иә, дұрыс.", "Иә, {city} қаласындамын."]
    S2:
      caller:
        ru:
          - "Зафиксирована операция на {amount_medium} тенге в интернет-магазине. Вы её совершали?"
          - "Списание {amount_small} тенге за подписку. Это ваша операция?"
          - "Попытка оплаты в другой стране. Подтверждаете — да или нет?"
        kk:
          - "Интернет-дүкенде {amount_medium} теңге операциясы тіркелді. Сіз жасадыңыз ба?"
          - "{amount_small} теңге жазылым үшін алынды. Бұл сіздің операцияңыз ба?"
      # flag_bearing: легитимная срочность и упоминание кода
      caller_flag_bearing:
        ru:
          - "Если это не вы — решение нужно принять в ближайшие минуты, пока операция в обработке."
          - "Вам сейчас придёт SMS с кодом. Никому его не называйте, включая меня."
          - "Отделение закрывается через полчаса, если хотите успеть с перевыпуском сегодня."
          - "Ещё момент: ваша заявка на кредит одобрена, деньги можно забрать в отделении."
          - "По заявке на кредит, которую вы подавали в понедельник, решение положительное."
        kk:
          - "Егер бұл сіз болмасаңыз, шешімді жақын минуттарда қабылдау керек."
          - "Сізге қазір SMS-код келеді. Оны ешкімге айтпаңыз, маған да."
      victim:
        ru: ["Нет, это не я.", "Да, это моя покупка.", "Подождите, какая операция?",
             "Нет, я такого не делал."]
        kk: ["Жоқ, бұл мен емеспін.", "Иә, бұл менің сатып алуым.", "Тоқтаңыз, қандай операция?"]
    SB:
      caller:
        ru:
          - "Понял, блокирую карту. Перевыпуск займёт три дня, заберёте в отделении."
          - "Хорошо, раз операция ваша — ничего не делаем, карта работает."
          - "Можете положить трубку и перезвонить нам по номеру на обороте карты, я подожду."
          - "Никаких переводов делать не нужно, средства остаются на вашем счету."
        kk:
          - "Түсінікті, картаны бұғаттаймын. Қайта шығару үш күн алады."
          - "Телефонды қойып, картаның артындағы нөмірге қоңырау шала аласыз."
          - "Ешқандай аударым жасаудың қажеті жоқ, қаражат шотыңызда қалады."
      victim:
        ru: ["Хорошо, блокируйте.", "Спасибо.", "Я лучше сам перезвоню.", "Понял, спасибо."]
        kk: ["Жақсы, бұғаттаңыз.", "Рахмет.", "Өзім қайта қоңырау шалайын."]

  # ═══════════════════════════════════════════════════════════════════
  BN02:  # Родственник действительно просит денег — ключевой трудный негатив
    S0:
      caller:
        ru:
          - "Алло, аға, привет! Занят?"
          - "Апа, сәлеметсіз бе, это я."
          - "Привет! Ты дома? Есть минутка?"
        kk:
          - "Алло, аға, сәлем! Бос емессің бе?"
          - "Сәлем! Үйдесің бе?"
      victim:
        ru: ["Привет! Да, слушаю.", "О, привет. Что случилось?", "Да, свободен."]
        kk: ["Сәлем! Иә, тыңдап тұрмын.", "О, сәлем. Не болды?"]
    S1:
