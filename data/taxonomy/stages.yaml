# Қалқан — универсальная схема стадий разговора (crime script)
# Основано на: ScriptMind (arXiv:2601.13581) — crime script inference,
# адаптировано под казахстанские сценарии по открытым источникам
# (Генпрокуратура РК, Нацбанк РК, МВД РК, ЕНПФ).
#
# Каждая реплика в корпусе размечается: stage + intent + scam_likelihood [0..1]

schema_version: "1.0"
language: ["ru", "kk", "kk-ru"]  # kk-ru = смешанная речь (code-switching)

stages:
  - id: S0
    code: contact
    name_ru: "Установление контакта и представление"
    name_kk: "Байланыс орнату және таныстыру"
    description_ru: >
      Звонящий представляется сотрудником организации, обладающей авторитетом:
      банк, Нацбанк, полиция, оператор связи, eGov, ЕНПФ, поликлиника.
    typical_scam_likelihood: 0.15
    note: >
      Сам по себе этап НЕ является индикатором мошенничества — легитимные
      организации звонят так же. Ключ к детекции — динамика последующих стадий.

  - id: S1
    code: credibility
    name_ru: "Построение доверия"
    name_kk: "Сенім орнату"
    description_ru: >
      Демонстрация осведомлённости: называют ФИО, ИИН, последние цифры карты,
      реальный адрес отделения. Подмена номера на официальный.
      Использование ИИ-дипфейков (видеозвонок, поддельные удостоверения).
    typical_scam_likelihood: 0.35

  - id: S2
    code: hook
    name_ru: "Инъекция угрозы или приманки"
    name_kk: "Қауіп немесе жем салу"
    description_ru: >
      Два полюса. Угроза: «на вас оформляют кредит», «несанкционированная
      операция», «возбуждено уголовное дело», «ваши накопления пытаются украсть».
      Приманка: скидка 30%, найден неучтённый стаж, гарантированная доходность.
    typical_scam_likelihood: 0.60

  - id: S3
    code: isolation
    name_ru: "Изоляция и давление временем"
    name_kk: "Оқшаулау және уақытпен қысым"
    description_ru: >
      «Не кладите трубку», «линия должна оставаться открытой», «никому не
      рассказывайте, идёт следствие», «у вас две минуты», «счёт сейчас заблокируют».
      Главная тактика по оценке Нацбанка — удерживать человека на линии,
      лишая времени на консультацию с близкими.
    typical_scam_likelihood: 0.85
    note: "Сильнейший одиночный маркер. Легитимные организации так не делают."

  - id: S4
    code: escalation
    name_ru: "Эскалация и передача второму актёру"
    name_kk: "Шиеленісу және екінші актёрге беру"
    description_ru: >
      Подключается «сотрудник правоохранительных органов» / «следователь» /
      «специалист Нацбанка». Многоактёрная схема повышает достоверность
      и усиливает давление.
    typical_scam_likelihood: 0.88

  - id: S5
    code: action_request
    name_ru: "Запрос целевого действия"
    name_kk: "Мақсатты әрекетті сұрау"
    description_ru: >
      Продиктовать SMS-код; перевести на «безопасный счёт»; оформить кредит
      и перевести; установить AnyDesk/TeamViewer; включить демонстрацию экрана;
      передать наличные курьеру; перейти по ссылке и ввести данные карты.
    typical_scam_likelihood: 0.95
    note: "Точка невозврата. Предупреждение, поступившее здесь, уже почти опоздало."

  - id: SB
    code: benign_resolution
    name_ru: "Легитимное закрытие разговора"
    name_kk: "Әңгіменің заңды аяқталуы"
    description_ru: >
      Встречается только в легитимных звонках: собеседник предлагает перезвонить
      самому, отправляет информацию официальным каналом, спокойно принимает отказ,
      снимает срочность. Мошеннический сценарий этой стадии не имеет.
    typical_scam_likelihood: 0.03
    benign_only: true

  - id: S6
    code: extraction
    name_ru: "Извлечение и закрепление"
    name_kk: "Алу және бекіту"
    description_ru: >
      Подтверждение выполнения, повторный заход («нужен ещё один перевод»),
      удержание жертвы от обращения в банк или полицию.
    typical_scam_likelihood: 0.97

# Целевая метрика раннего предупреждения:
# turns_to_detection — на какой реплике система впервые превысила порог.
# Практическая ценность появляется при срабатывании на S2-S3,
# то есть ДО запроса целевого действия (S5).
early_warning_target:
  fire_before_stage: S5
  ideal_stage: S3
