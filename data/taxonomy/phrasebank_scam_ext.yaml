# Қалқан — расширение банка реплик мошеннических сценариев (v3)
#
# ЗАЧЕМ. В фразобанке v2 у большинства пулов было 1–3 формулировки, поэтому
# разбиение по шаблонам (make_template_holdout.py) не могло поделить пул на
# train / val / holdout без пересечений. Здесь — новые самостоятельные
# формулировки тех же намерений (поле intent в phrasebank_scam.yaml).
#
# Файл сливается с phrasebank_scam.yaml при загрузке (generate_corpus.merge_ext):
# списки реплик дописываются в те же пулы. Структура повторяет базовый файл.
#
# Как написано. Реплики написаны с помощью LLM (Claude, Anthropic) по намерениям
# стадий и публичным описаниям схем из scam_scenarios.yaml. Намеренно:
#   * часть реплик передаёт приём без ключевых слов из redflags.py
#     («счёт-дублёр» вместо «безопасный счёт») — как в живой речи мошенников;
#   * часть казахских реплик — смешанная речь внутри одной фразы.
# ВАЖНО: казахские реплики требуют вычитки носителем.

scenarios:

  SC01:
    S0:
      caller:
        ru:
          - "Алло, {victim_name} {patronymic}? Беспокоит {bank}, отдел безопасности, {agent_name}."
          - "Здравствуйте, это центр мониторинга {bank}. Разговор записывается."
          - "Добрый вечер. {agent_name}, служба защиты клиентов {bank}. Уделите минуту?"
          - "Здравствуйте, {bank}, отдел финансового контроля. Звоню по вашему счёту."
          - "Алло, добрый день. Вас беспокоят из антифрод-отдела {bank}."
        kk:
          - "Алло, {victim_name}? {bank} қауіпсіздік бөлімі, {agent_name}."
          - "Сәлеметсіз бе, бұл {bank} мониторинг орталығы. Әңгіме жазылып жатыр."
          - "Қайырлы кеш. {bank} клиенттерді қорғау қызметінен хабарласып тұрмын."
          - "Сәлеметсіз бе, {bank}, служба безопасности. Шотыңыз бойынша звоню."
    S1:
      caller:
        ru:
          - "Подтвердите, пожалуйста, последние цифры карты — у меня в системе {card_last4}."
          - "У вас зарплатная карта и депозит в нашем банке, всё верно?"
          - "Вы проживаете в {city}, {district}? Сверяю адрес из анкеты."
          - "Вижу вчерашнюю оплату на {amount_small} тенге — это ваша покупка?"
          - "Ваша анкета у меня открыта, {victim_name} {patronymic}. Этот номер основной?"
        kk:
          - "Картаңыздың соңғы төрт саны {card_last4}, солай ма?"
          - "Сіз {city} қаласында, {district} тұрасыз ба? Анкетадағы мекенжайды тексеріп жатырмын."
          - "Сізде біздің банкте депозит пен жалақы картасы бар, дұрыс па?"
          - "Анкетаңыз алдымда тұр, {victim_name}. Бұл нөмір негізгі ме?"
    S2:
      caller:
        ru:
          - "Только что с вашей карты попытались перевести {amount_medium} тенге на неизвестный счёт."
          - "Кто-то подключил ваш номер к мобильному банку на другом телефоне."
          - "Ваши данные попали в базу, которую продают мошенникам, по ним уже пытаются снять деньги."
          - "Система остановила подозрительную операцию, но через час она пройдёт повторно."
        kk:
          - "Жаңа ғана картаңыздан белгісіз шотқа {amount_medium} теңге аударуға тырысты."
          - "Біреу нөміріңізді басқа телефондағы мобильді банкке қосқан."
          - "Деректеріңіз алаяқтарға сатылатын базаға түсіп қалған, подозрительная операция уже была."
    S3:
      caller:
        ru:
          - "Пожалуйста, не отключайтесь, я фиксирую операцию в реальном времени."
          - "Сотрудникам в отделении ничего не объясняйте, среди них есть соучастники."
          - "Мужу и детям пока ничего не рассказывайте, так мы быстрее закроем вопрос."
          - "Операция пройдёт через пятнадцать минут, если мы её не отменим вместе."
        kk:
          - "Өтінемін, байланысты үзбеңіз, операцияны нақты уақытта бақылап отырмын."
          - "Бөлімшедегі қызметкерлерге ештеңе түсіндірмеңіз, олардың арасында сыбайластар бар."
          - "Он бес минуттан кейін аударым өтіп кетеді, үлгеру керек."
    S4:
      caller:
        ru:
          - "Сейчас подключу сотрудника Национального банка, он курирует такие случаи."
          - "Я передаю вызов в финансовый мониторинг, не отключайтесь."
          - "С вами свяжется капитан {agent_name} из {authority}, отвечайте ему честно."
          - "Ваше дело взял на контроль {authority}, сейчас переключу на дежурного."
        kk:
          - "Қазір Ұлттық банк қызметкерін қосамын, ол осындай істерді бақылайды."
          - "Қоңырауды қаржы мониторингіне ауыстырамын, тұтқаны қоймаңыз."
          - "Сізбен {authority} капитаны {agent_name} сөйлеседі."
          - "Ісіңізді {authority} бақылауға алды, кезекшіге переключаю."
    S5:
      caller:
        ru:
          - "Откройте приложение и переведите все средства на счёт-дублёр, я продиктую номер."
          - "Сейчас придёт сообщение из банка — прочитайте мне цифры, это отмена заявки."
          - "Оформите в приложении кредит на ту же сумму, мы его сразу погасим, и мошенники не успеют."
          - "Деньги нужно временно вывести на защищённый счёт Нацбанка, потом вернём с процентами."
        kk:
          - "Қосымшаны ашып, барлық қаражатты дубль-шотқа аударыңыз, нөмірін айтамын."
          - "Қазір банктен хабарлама келеді — сандарын маған оқып беріңіз, бұл өтінімді болдырмау."
          - "Қосымшада сол сомаға несие рәсімдеңіз, біз оны бірден жабамыз."
    S6:
      caller:
        ru:
          - "Всё, средства под защитой. В течение трёх дней никуда не обращайтесь."
          - "Если позвонят из отделения и спросят про перевод — скажите, что делали его сами."
          - "На следующей неделе я перезвоню, вернём деньги на основной счёт."
          - "Удалите, пожалуйста, историю звонков, так безопаснее для расследования."
          - "У вас ведь есть ещё кредитная карта? Её лимит тоже нужно перевести."
        kk:
          - "Болды, қаражат қорғауда. Үш күн бойы ешқайда хабарласпаңыз."
          - "Бөлімшеден қоңырау шалып аударым туралы сұраса, өзім жасадым деңіз."
          - "Келесі аптада қайта хабарласамын, ақшаны негізгі шотқа қайтарамыз."
          - "Кредиттік картаңыз да бар ғой? Оның лимитін де аудару керек."

  SC02:
