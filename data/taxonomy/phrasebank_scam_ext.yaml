          - "Хабарламалардың тасасында олар кабинетке кіру кодын алуға тырысып жатыр."
          - "Нөміріңіз шабуыл тізіміне түсті, келесі қадам — мобильді банкке кіру."
          - "Қорғанысты шұғыл қосу керек, әйтпесе SIM-картаны қайта шығарып алады."
