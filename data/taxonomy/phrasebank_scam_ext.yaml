          - "Вы пользуетесь номером больше пяти лет, так?"
          - "У вас подключён тариф с безлимитным интернетом, правильно?"
          - "Последнее пополнение было на {amount_small} тенге, это вы пополняли?"
          - "По базе номер привязан к eGov, вы через него получаете SMS?"
          - "Сверю данные: {victim_name} {patronymic}, {city}, {district}?"
        kk:
          - "Нөмір {city} қаласында берілген жеке куәлігіңізге тіркелген, дұрыс па?"
          - "Бұл нөмірді бес жылдан астам қолданып келесіз, солай ма?"
          - "Сізде шексіз интернеті бар тариф қосулы, иә?"
          - "Соңғы толықтыру {amount_small} теңге болды, сіз салдыңыз ба?"
          - "Нөміріңіз eGov-қа байланған, SMS-терді соған алып тұрсыз ба?"
