          - "Здравствуйте, это {telecom}, центр обслуживания абонентов, {city}."
          - "Алло, здравствуйте. Оператор {telecom}, звонок по плановой проверке номеров."
          - "Добрый день, {telecom}, отдел регистрации абонентов."
