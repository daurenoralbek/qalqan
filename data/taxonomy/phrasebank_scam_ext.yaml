      caller:
        ru:
          - "По новым правилам все номера проходят повторную регистрацию, ваш ещё не прошёл."
          - "Ваш договор заключён по старому образцу, его нужно переподписать."
          - "Если не обновить данные сегодня, номер заблокируют вместе с доступом к банковским приложениям."
          - "На ваше удостоверение зарегистрирован ещё один номер, его нужно подтвердить или отключить."
          - "Мы переводим абонентов на новую систему, без подтверждения номер перестанет работать."
        kk:
          - "Жаңа ереже бойынша барлық нөмір қайта тіркеледі, сіздікі әлі өтпеген."
          - "Шартыңыз ескі үлгімен жасалған, оған қайта қол қою керек."
          - "Бүгін деректерді жаңартпасаңыз, нөмір банк қосымшаларымен бірге бұғатталады."
          - "Жеке куәлігіңізге тағы бір нөмір тіркелген, оны растау керек или отключить."
    S5:
      caller:
        ru:
          - "Сейчас придёт сообщение с цифрами, назовите их, и я закрою заявку."
          - "Код подтверждения из SMS нужно продиктовать мне, в приложении он не сработает."
          - "Прочитайте, что пришло от eGov, это номер вашей заявки на продление."
          - "Скажите, пожалуйста, цифры из сообщения — только цифры, текст не нужен."
          - "Я отправил проверочный код, назовите его для завершения регистрации."
        kk:
          - "Қазір сандары бар хабарлама келеді, соны айтыңыз, өтінімді жабамын."
          - "eGov-тан келген хабарламаны оқып беріңізші, бұл ұзарту өтінімінің нөмірі."
          - "Хабарламадағы сандарды айтыңызшы, мәтіннің керегі жоқ."
          - "Тексеру кодын жібердім, тіркеуді аяқтау үшін айтыңыз."

  SC03:
    S0:
      caller:
        ru:
          - "Алло, {telecom}, мониторинг сетевой безопасности."
