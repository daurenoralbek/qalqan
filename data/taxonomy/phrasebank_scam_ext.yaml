          - "Қайырлы күн, {agent_name}, {telecom}. Нөміріңіз бойынша қоңырау шалып тұрмын."
          - "Сәлеметсіз бе, {telecom}, абоненттерді тіркеу бөлімі."
          - "Алло, {telecom} операторы, нөмірлерді жоспарлы тексеру бойынша звонок."
    S1:
      caller:
