# Қалқан — расширение общих приветствий тем (v3)
#
# Сливается с topics.yaml при загрузке (generate_corpus.merge_ext).
# Нейтральные приветствия подходят обоим классам темы — так и звонят в жизни.
# Как написано: с помощью LLM (Claude, Anthropic). Казахский — без вычитки носителем.

topics:

  bank:
    shared_openings:
      ru:
        - "Здравствуйте, {bank}, {agent_name}. Звоню по вашему счёту."
        - "Алло, добрый день, {bank}, у вас есть минутка?"
        - "Здравствуйте, {victim_name} {patronymic}, это {bank}, отделение в {city}."
        - "Добрый день, {bank}, по операции на вашей карте, удобно говорить?"
      kk:
        - "Сәлеметсіз бе, {bank}, {agent_name}. Шотыңыз бойынша хабарласып тұрмын."
        - "Алло, қайырлы күн, {bank}, бір минут уақытыңыз бар ма?"
        - "Сәлеметсіз бе, {victim_name}, бұл {bank}, {city} бөлімшесі."

  credit:
    shared_openings:
      ru:
        - "Здравствуйте, {bank}, звоню по вашему кредиту, удобно?"
        - "Добрый день, {bank}, по кредитной заявке."
        - "Алло, {victim_name} {patronymic}? {bank}, кредитный отдел, {agent_name}."
        - "Здравствуйте, {agent_name}, {bank}, по вашему договору займа."
      kk:
        - "Сәлеметсіз бе, {bank}, несиеңіз бойынша, ыңғайлы ма?"
        - "Қайырлы күн, {bank}, несие өтінімі бойынша."
        - "Алло, {victim_name}? {bank} несие бөлімі, {agent_name}."

  telecom:
    shared_openings:
      ru:
        - "Здравствуйте, {telecom}, звоню по вашему договору."
        - "Алло, {telecom}, {agent_name}, по номеру, который на вас оформлен."
        - "Добрый день, {telecom}, есть минута?"
        - "Здравствуйте, {telecom}, отдел обслуживания."
      kk:
        - "Сәлеметсіз бе, {telecom}, шартыңыз бойынша хабарласып тұрмын."
        - "Алло, {telecom}, {agent_name}, атыңыздағы нөмір бойынша."
        - "Қайырлы күн, {telecom}, бір минут бар ма?"

  telecom_security:
    shared_openings:
      ru:
        - "Здравствуйте, {telecom}, по безопасности вашего номера."
        - "Алло, {victim_name} {patronymic}? {telecom}, служба безопасности."
        - "Добрый день, {agent_name}, {telecom}, звоню по сообщениям на ваш номер."
        - "Здравствуйте, {telecom}, по уведомлению системы защиты."
        - "Алло, {telecom}, по вашему номеру есть вопрос."
      kk:
        - "Сәлеметсіз бе, {telecom}, нөміріңіздің қауіпсіздігі бойынша."
        - "Алло, {victim_name}? {telecom}, қауіпсіздік қызметі."
        - "Қайырлы күн, {agent_name}, {telecom}, нөміріңізге келген хабарламалар бойынша."

  pension:
    shared_openings:
      ru:
        - "Здравствуйте, {pension_fund}, по вашему пенсионному счёту."
        - "Алло, {victim_name} {patronymic}? {gov_org}, {agent_name}."
        - "Добрый день, звоню по вопросу вашей пенсии, удобно?"
        - "Здравствуйте, {pension_fund}, по вашему заявлению."
      kk:
        - "Сәлеметсіз бе, {pension_fund}, зейнетақы шотыңыз бойынша."
        - "Алло, {victim_name}? {gov_org}, {agent_name} хабарласып тұр."
        - "Қайырлы күн, зейнетақыңыз бойынша хабарласып тұрмын, ыңғайлы ма?"

  invest:
    shared_openings:
      ru:
        - "Здравствуйте, {agent_name}, по вопросу инвестиций."
        - "Алло, {victim_name}? {agent_name}, звоню по вашей заявке на консультацию."
        - "Добрый день, инвестиционный отдел, есть пара минут?"
        - "Здравствуйте, вы оставляли контакты на финансовом форуме, {agent_name}."
        - "Добрый день, {agent_name}, по поводу вложений, как договаривались."
      kk:
        - "Сәлеметсіз бе, {agent_name}, инвестиция мәселесі бойынша."
        - "Алло, {victim_name}? {agent_name}, кеңеске өтініміңіз бойынша."
        - "Қайырлы күн, инвестициялық бөлім, бірер минут бар ма?"
        - "Қайырлы күн, {agent_name}, салым туралы, келіскеніміздей."

  tech_support:
    shared_openings:
      ru:
        - "Здравствуйте, техподдержка, по вашему обращению."
        - "Алло, {victim_name} {patronymic}? Служба поддержки, {agent_name}."
        - "Добрый день, {telecom}, технический отдел."
        - "Здравствуйте, сервисная служба, звоню насчёт вашего устройства."
      kk:
        - "Сәлеметсіз бе, техникалық қолдау, өтінішіңіз бойынша."
        - "Алло, {victim_name}? Қолдау қызметі, {agent_name}."
        - "Қайырлы күн, {telecom}, техникалық бөлім."

  relative:
    shared_openings:
      ru:
        - "Алло, это я, слышишь?"
        - "Привет, не занят? Это я."
        - "Мам, привет, это я."
        - "Алло, аға, это я, с другого номера."
        - "Привет, узнал?"
      kk:
        - "Алло, бұл менмін, естисің бе?"
        - "Сәлем, бос емессің бе? Бұл менмін."
        - "Апа, сәлем, бұл мен."
        - "Сәлем, таныдың ба?"

  delivery:
    shared_openings:
      ru:
        - "Здравствуйте, доставка, вы дома?"
        - "Алло, курьер, звоню по вашему заказу."
        - "Добрый день, по доставке посылки на ваше имя."
        - "Здравствуйте, {agent_name}, служба доставки."
      kk:
        - "Сәлеметсіз бе, жеткізу қызметі, үйдесіз бе?"
        - "Алло, курьер, тапсырысыңыз бойынша."
        - "Қайырлы күн, атыңызға келген сәлемдеме бойынша."

  clinic:
    shared_openings:
      ru:
        - "Здравствуйте, поликлиника, звоню по вашей записи."
        - "Алло, {victim_name} {patronymic}? Это поликлиника {district}."
        - "Добрый день, регистратура, удобно говорить?"
        - "Здравствуйте, медсестра участка, по вашему визиту."
        - "Добрый день, поликлиника, по вашим анализам."
      kk:
        - "Сәлеметсіз бе, емхана, жазылуыңыз бойынша."
        - "Алло, {victim_name}? Бұл {district} емханасы."
        - "Қайырлы күн, тіркеу бөлімі, сөйлесуге ыңғайлы ма?"

  job:
    shared_openings:
      ru:
        - "Здравствуйте, {agent_name}, по вашему резюме."
        - "Алло, {victim_name}? Отдел персонала, {agent_name}."
        - "Добрый день, звоню по вакансии, вам удобно?"
        - "Здравствуйте, по поводу вашего отклика на вакансию."
        - "Добрый день, {agent_name}, кадровая служба."
      kk:
        - "Сәлеметсіз бе, {agent_name}, түйіндемеңіз бойынша."
        - "Алло, {victim_name}? Персонал бөлімі, {agent_name}."
        - "Қайырлы күн, бос орын бойынша хабарласып тұрмын, ыңғайлы ма?"
