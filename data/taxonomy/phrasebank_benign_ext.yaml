        kk:
          - "Көп рахмет, жұмада келісілгендей қайтарамын."
          - "Кешке өзім барып, қолыңа беремін."
      victim:
        ru: ["Не за что, свои же.", "Хорошо, кидай номер.", "Давай, береги себя.",
