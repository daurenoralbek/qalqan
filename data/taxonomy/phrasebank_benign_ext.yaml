# Қалқан — расширение банка реплик ЛЕГИТИМНЫХ звонков (v3)
#
# Сливается с phrasebank_benign.yaml при загрузке (generate_corpus.merge_ext).
# Структура повторяет базовый файл: S0, S1, S2, SB; caller, caller_flag_bearing, victim.
#
# flag_bearing (v3). Добавлены легитимные реплики с маркерами, которые в v2
# встречались почти только у мошенников: «специальный счёт» (выплата ЕНПФ на
# жильё в Отбасы банке — реальная процедура), «соединяю вас со специалистом»,
# «без риска» и «комиссия для вывода» в устах лицензированного брокера,
# AnyDesk в предупреждении техподдержки. Модель должна различать по контексту.
#
# Как написано: с помощью LLM (Claude, Anthropic), по сценариям benign_scenarios.yaml.
# ВАЖНО: казахские реплики требуют вычитки носителем.

scenarios:

  BN01:
    S0:
      caller:
        ru:
          - "Алло, {victim_name} {patronymic}? {bank}, служба контроля карточных операций."
          - "Здравствуйте, {agent_name}, {bank}. Звоню подтвердить недавний платёж."
          - "Добрый день, {bank}, отдел по предотвращению мошенничества, звонок записывается."
          - "Здравствуйте, это {bank}. Пара вопросов по вашей карте, займёт минуту."
          - "Добрый вечер, {bank}, круглосуточный мониторинг операций."
        kk:
          - "Алло, {victim_name}? {bank}, карта операцияларын бақылау қызметі."
          - "Сәлеметсіз бе, {agent_name}, {bank}. Жақындағы төлемді растау үшін хабарласып тұрмын."
          - "Қайырлы кеш, {bank}, операцияларды тәулік бойы бақылау."
          - "Сәлеметсіз бе, бұл {bank}. Картаңыз бойынша пара вопросов, бір минут алады."
      victim:
        ru: ["Да, здравствуйте, это я.", "Слушаю, что-то с картой?"]
        kk: ["Иә, сәлеметсіз бе, менмін.", "Тыңдап тұрмын, картада бірдеңе болды ма?"]
    S1:
      caller:
        ru:
          - "Для проверки назову только последние цифры карты: {card_last4}. Больше ничего не нужно."
          - "Вы сейчас совершаете покупки за границей? Достаточно ответить да или нет."
          - "Я не прошу никаких данных — только подтвердить, ваша ли это операция."
          - "Вам удобно сейчас? Разговор займёт не больше минуты."
          - "Номер обращения {case_number}, его можно проверить в приложении в разделе уведомлений."
          - "Карта {card_last4}, выпущена в {city} — это ваша основная карта?"
        kk:
          - "Тексеру үшін картаның соңғы сандарын ғана айтамын: {card_last4}. Басқа ештеңе керек емес."
          - "Қазір шетелде сатып алу жасап жатырсыз ба? Иә немесе жоқ деп жауап берсеңіз жеткілікті."
          - "Ешқандай дерек сұрамаймын — тек операция сіздікі ме, соны растаңыз."
          - "Өтініш нөмірі {case_number}, оны қосымшадағы хабарламалар бөлімінен тексеруге болады."
          - "Қазір ыңғайлы ма? Әңгіме бір минуттан аспайды."
      victim:
        ru: ["Да, это моя основная.", "Нет, я сейчас дома.", "Хорошо, спрашивайте."]
        kk: ["Иә, бұл негізгі картам.", "Жоқ, қазір үйдемін.", "Жақсы, сұраңыз."]
    S2:
      caller:
        ru:
          - "Сегодня в 03:40 была попытка оплаты на {amount_medium} тенге на зарубежном сайте. Это вы?"
          - "По вашей карте прошли три одинаковых платежа подряд, хотим уточнить, не ошибка ли."
          - "Операция на {amount_small} тенге в такси заблокирована системой. Вы ездили на такси?"
          - "Перевод на {amount_medium} тенге другому лицу выглядит для вас нетипично. Подтверждаете?"
          - "Вижу снятие наличных в {city}. Это были вы?"
        kk:
          - "Бүгін 03:40-та шетелдік сайтта {amount_medium} теңге төлеуге әрекет болды. Бұл сіз бе?"
          - "Картаңыздан қатарынан үш бірдей төлем өтті, қате емес пе, нақтылағымыз келеді."
          - "Таксидегі {amount_small} теңге операциясын жүйе бұғаттады. Таксиге мінгенсіз бе?"
          - "{city} қаласында қолма-қол ақша шешілгенін көріп тұрмын. Бұл сіз бе?"
      caller_flag_bearing:
        ru:
          - "Если операция не ваша, я сейчас заблокирую карту, а новую выпустим бесплатно."
          - "Никому не сообщайте код из SMS, даже если позвонят от имени банка."
          - "Напомню: банк никогда не просит переводить деньги на безопасный счёт."
          - "Решение нужно в течение суток, потом операция пройдёт автоматически."
        kk:
          - "SMS-тегі кодты ешкімге айтпаңыз, банктен деп қоңырау шалса да."
          - "Еске салайын: банк ешқашан ақшаны қауіпсіз шотқа аударуды сұрамайды."
          - "Несиеге өтінім мақұлданды, ақшаны бөлімшеден алуға болады."
      victim:
        ru: ["Да, это я в магазине платил.", "Нет! Я ничего не покупал ночью.",
             "Сейчас открою приложение, посмотрю.", "Нет, в интернете я картой не плачу.", "Кажется, это сын что-то заказывал."]
        kk: ["Иә, дүкенде мен төледім.", "Жоқ! Түнде ештеңе сатып алған жоқпын.",
             "Қазір қосымшаны ашып қараймын.", "Жоқ, интернетте картамен төлемеймін."]
    SB:
      caller:
        ru:
          - "Карту заблокировал, деньги на счёте в безопасности, переводить никуда не нужно."
          - "Спорную операцию оспорим сами, заявление можно подать в приложении."
          - "Если будут звонить якобы от нас и просить коды — сразу кладите трубку."
          - "Новую карту привезёт курьер банка, при получении покажете удостоверение."
        kk:
          - "Картаны бұғаттадым, ақша шотта аман, еш жаққа аударудың қажеті жоқ."
          - "Даулы операцияны өзіміз даулаймыз, өтінішті қосымшада беруге болады."
          - "Біздің атымыздан қоңырау шалып код сұраса — бірден телефонды қойыңыз."
      victim:
        ru: ["Спасибо, что позвонили.", "Хорошо, буду ждать карту.",
             "А карту можно забрать в отделении?", "Я потом сам перезвоню по номеру с карты.", "А деньги за операцию вернутся?"]
        kk: ["Хабарласқаныңызға рахмет.", "Жақсы, картаны күтемін.",
             "Картаны бөлімшеден алуға бола ма?", "Кейін карта артындағы нөмірге хабарласамын."]

  BN02:
    S0:
      caller:
        ru:
          - "Алло, апа, это я, с нового номера, сохрани."
          - "Привет, брат! Не отвлекаю?"
          - "Алло, мам, привет, ты не спишь?"
          - "Сәлем, аға, это Данияр. Можешь говорить?"
          - "Привет, это я, звоню с рабочего."
        kk:
          - "Алло, апа, бұл менмін, жаңа нөмірден, сақтап ал."
          - "Сәлем, аға! Алаңдатпаймын ба?"
          - "Алло, мама, сәлем, ұйықтамай жатырсың ба?"
          - "Сәлем, бұл менмін, жұмыстан хабарласып тұрмын."
      victim:
        ru: ["Привет, родной.", "О, это ты? Не узнал номер.", "Да, говори."]
        kk: ["Сәлем, қалқам.", "О, сенсің бе? Нөмірді танымадым.", "Иә, айта бер."]
    S1:
      caller:
        ru:
          - "Как дети? Айгерим в школу уже пошла?"
          - "Слушай, ты в субботу на той придёшь?"
          - "Как здоровье у апашки? Я на прошлой неделе заезжал."
          - "Ты ещё в том же офисе работаешь?"
          - "Я тут в городе, после учёбы, вот решил позвонить."
          - "Помнишь, я тебе говорил про ремонт? Вот начали."
        kk:
          - "Балалар қалай? Айгерім мектепке барды ма?"
          - "Тыңдашы, сенбіде тойға келесің бе?"
          - "Әжемнің денсаулығы қалай? Өткен аптада барып қайттым."
          - "Әлі сол кеңседе жұмыс істейсің бе?"
          - "Есіңде ме, жөндеу туралы айтқанмын? Міне, бастадық."
      victim:
        ru: ["Да всё хорошо, спасибо.", "Приду, конечно.", "Нормально, работаю.", "Помню, как там идёт?"]
        kk: ["Бәрі жақсы, рахмет.", "Әрине, барамын.", "Есімде, қалай жүріп жатыр?"]
    S2:
      caller:
        ru:
          - "Мне за курсы надо заплатить {amount_small}, а зарплата только через неделю. Выручишь?"
          - "Машина сломалась, ремонт {amount_medium}, можешь часть занять?"
          - "Не хватает на подарок маме, скинешься со мной?"
          - "Мне за квартиру платить завтра, а перевод с работы задержали."
          - "Можешь одолжить {amount_small} до понедельника? Верну на Kaspi."
        kk:
          - "Курсқа {amount_small} төлеу керек, жалақы бір аптадан кейін. Көмектесесің бе?"
          - "Көлік бұзылды, жөндеу {amount_medium}, бір бөлігін қарызға бере аласың ба?"
          - "Анама сыйлыққа жетпей тұр, бірге салысасың ба?"
          - "Дүйсенбіге дейін {amount_small} қарызға бере тұрасың ба? Kaspi-ге қайтарамын."
      caller_flag_bearing:
        ru:
          - "Брат, я чуть не попал в аварию, всё нормально, но машину надо чинить."
          - "Папе пока не говори, что я занимал, он переживать будет."
        kk:
          - "Әкеме әзірше айтпа, қарыз алғанымды білсе, уайымдайды."
          - "Бүгін кешке дейін керек еді, ертең кеш болады."
      victim:
        ru: ["Сейчас посмотрю, сколько есть.", "Могу половину, пойдёт?",
             "У самого туго, но половину скину.", "А маме ты говорил? Она спрашивала.", "Давай я перезвоню на старый номер."]
