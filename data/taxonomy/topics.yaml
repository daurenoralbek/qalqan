        - "Алло, это технический специалист, звоню насчёт вашего интернета."
      kk:
        - "Сәлеметсіз бе, {telecom} техникалық қолдау қызметі, {agent_name}."
        - "Қайырлы күн, {bank} қолдау қызметі, {case_number} өтініші бойынша."

  relative:
