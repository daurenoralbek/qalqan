        - "Добрый день, {victim_name} {patronymic}. {bank}, по вашему кредиту."
        - "{bank}: по вашему кредитному договору есть изменения, звоню уточнить."
      kk:
        - "Сәлеметсіз бе, {bank} несие бөлімі. Атыңыздағы несие өтінімі бойынша хабарласып тұрмын."
        - "Қайырлы күн, {victim_name}. {bank}, несиеңіз бойынша."

  telecom:
