# Қалқан — темы звонков (v2)
#
# ЗАЧЕМ ЭТОТ ФАЙЛ. В корпусе v1 тема звонка выдавала класс: ЕНПФ, «Антиспам»,
# AnyDesk встречались только у мошенников, курьер, поликлиника и HR — только
# у легитимных. Приветствия внутри пар одной темы тоже были написаны разным
# стилем. Обученная модель выучила «звонок про банк = мошенничество»:
# на шаблонном holdout AUC только по первой реплике был 0.972 (XLM-R) и 0.911
# (логистическая регрессия на символьных n-граммах), а настоящее приветствие
# банка на реальных звонках получало p ≈ 1.0.
#
# ПРИНЦИП v2 — тема не несёт информации о классе:
#   1. у каждой темы есть и мошеннические, и легитимные сценарии;
#   2. диалог порождается так: тема → класс → сценарий внутри темы,
#      поэтому P(тема | мошенничество) = P(тема | легитимный звонок);
#   3. приветствие (S0) и подтверждение личности (S1) берутся из ОБЩЕГО пула
#      темы — объединения пулов всех её сценариев обоих классов плюс
#      нейтральные приветствия ниже. Так сделано и в жизни: мошенник звонит
#      «из службы безопасности банка» теми же словами, что и настоящий банк
#      (stages.yaml: «S0 сам по себе не является индикатором мошенничества»).
# Отличие классов начинается со стадии S2 — там, где начинается манипуляция.
#
# Проверка: check_separability.py (баланс тем и «AUC первой реплики»).

schema_version: "2.0"

topics:

  bank:
    name_ru: "Банк: операции по карте"
    scam: [SC01]
    benign: [BN01]
    shared_openings:
      ru:
        - "Здравствуйте, {victim_name} {patronymic}. {bank}, звоню по вашей карте."
        - "Добрый день, {bank}. Вам удобно сейчас говорить?"
        - "Алло, {victim_name} {patronymic}? Это {bank}, {agent_name}."
      kk:
        - "Сәлеметсіз бе, {victim_name}. {bank}, картаңыз бойынша хабарласып тұрмын."
        - "Қайырлы күн, {bank}. Қазір сөйлесуге ыңғайлы ма?"

  credit:
