        - "Добрый день, звоню по вашему пенсионному делу, {agent_name}."
        - "Алло, {victim_name} {patronymic}? Это {gov_org}, по вашему заявлению."
      kk:
        - "Сәлеметсіз бе, {victim_name}. {pension_fund}, зейнетақы жинағыңыз бойынша."
        - "Қайырлы күн, зейнетақы ісіңіз бойынша хабарласып тұрмын."

  invest:
    name_ru: "Инвестиции"
    scam: [SC05]
    benign: [BN07]
    shared_openings:
