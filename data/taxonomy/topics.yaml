        - "Алло, {victim_name} {patronymic}? {telecom}, служба поддержки абонентов."
      kk:
        - "Сәлеметсіз бе, {telecom}, нөміріңіз бойынша хабарласып тұрмын."
        - "Қайырлы күн, бұл {telecom}, {agent_name}."

  telecom_security:
