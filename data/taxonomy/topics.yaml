        - "Добрый день, {telecom}, звоню по активности на вашем номере."
      kk:
        - "Сәлеметсіз бе, {telecom}, абоненттер қауіпсіздігі бөлімі."
        - "Қайырлы күн, {telecom}, нөміріңіздегі белсенділік бойынша хабарласып тұрмын."

  pension:
    name_ru: "Пенсия и госуслуги"
    scam: [SC04]
    benign: [BN10]
    shared_openings:
      ru:
