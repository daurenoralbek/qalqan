# Қалқан — нейтральные реплики (v3)
#
# В живом разговоре много реплик без информации о классе: «секунду, проверяю»,
# «алло, слышите?». Генератор (generate_corpus._maybe_filler) вставляет такую
# реплику после стадии с вероятностью P_FILLER — ОДИНАКОВОЙ для мошеннических и
# легитимных звонков. Пулы делятся на train / val / holdout, как и остальные.
# Здесь не должно быть ни одного маркера из redflags.py — проверяется в
# check_separability.py (раздел «нейтральные реплики»).
#
# Как написано: с помощью LLM (Claude, Anthropic). Казахский — без вычитки носителем.

caller:
  ru:
    - "Секунду, проверяю."
    - "Алло, вы меня слышите?"
    - "Одну минуту, открываю вашу карточку."
    - "Так, записываю."
    - "Прошу прощения, связь прерывается."
    - "Повторите, пожалуйста, я не расслышал."
    - "Сейчас, подождите немного."
    - "Ага, понял вас."
    - "Минутку, система долго грузится."
    - "Вы ещё на связи?"
    - "Хорошо, хорошо."
    - "Извините, тут шумно, говорите громче."
    - "Так... секундочку."
    - "Да-да, я вас слушаю."
    - "Понятно. Идём дальше."
    - "Сейчас уточню у коллеги."
    - "Не могу найти, подождите."
    - "Алло? Вы пропали."
    - "Угу."
    - "Всё, нашёл."
    - "Простите, как вы сказали?"
    - "Так, минуточку, пишу."
    - "Сейчас, у меня монитор завис."
  kk:
    - "Бір секунд, тексеріп жатырмын."
    - "Алло, мені естіп тұрсыз ба?"
    - "Бір минут, карточкаңызды ашып жатырмын."
    - "Жақсы, жазып алдым."
    - "Кешіріңіз, байланыс үзіліп жатыр."
    - "Қайталаңызшы, естімей қалдым."
    - "Қазір, сәл күте тұрыңыз."
    - "Иә, түсіндім."
    - "Жүйе баяу жүктеліп жатыр, бір минут."
    - "Байланыстасыз ба?"
    - "Жарайды, жарайды."
    - "Кешіріңіз, шулы екен, қаттырақ айтыңызшы."
    - "Қазір әріптесімнен сұрап білейін."
    - "Таба алмай тұрмын, күте тұрыңыз."
    - "Алло? Жоғалып кеттіңіз."
    - "Болды, таптым."
    - "Секунду, қазір қараймын."
    - "Так, бір минут, жазып жатырмын."

victim:
  ru:
    - "Алло? Плохо слышно."
    - "Подождите, я выйду в коридор."
    - "Секунду, ручку найду."
    - "Что? Повторите, пожалуйста."
    - "Да, я здесь."
    - "Угу."
    - "Так..."
    - "Минутку, у меня второй звонок."
    - "Я за рулём, говорите быстрее."
    - "Слышу, слышу."
    - "Сейчас, отойду от телевизора."
    - "Ага."
    - "Подождите, запишу."
    - "Извините, ребёнок плачет, секунду."
    - "Да-да."
    - "Ой, связь пропадает."
    - "Сейчас, наушники надену."
    - "Я на работе, могу недолго."
  kk:
    - "Алло? Нашар естіледі."
    - "Тоқтаңыз, дәлізге шығайын."
    - "Бір секунд, қалам тауып алайын."
    - "Не? Қайталаңызшы."
    - "Иә, осындамын."
    - "Иә-иә."
    - "Бір минут, екінші қоңырау түсіп жатыр."
    - "Көлік жүргізіп келемін, тезірек айтыңыз."
    - "Естимін, естимін."
    - "Қазір, жазып алайын."
    - "Кешіріңіз, бала жылап жатыр, бір секунд."
    - "Ой, байланыс үзіліп жатыр."
    - "Жұмыстамын, ұзақ сөйлесе алмаймын."
    - "Секунду, наушник киейін."
