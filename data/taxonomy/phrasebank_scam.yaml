# Қалқан — банк реплик мошеннических сценариев
#
# Источник формулировок: публичные предупреждения Генпрокуратуры РК, Нацбанка РК,
# МВД РК, ЕНПФ и сводка признаков finance.kz. Это фразы, которые ведомства сами
# публикуют для информирования населения — здесь они служат обучающим сигналом
# для детектора.
#
# Слоты в фигурных скобках заполняются из slots.yaml.
# ВАЖНО: казахские реплики требуют вычитки носителем перед финальным прогоном.

schema_version: "2.0"

scenarios:

  # ═══════════════════════════════════════════════════════════════════
  SC01:  # Служба безопасности банка → безопасный счёт
    S0:
      caller:
        ru:
          - "Здравствуйте, {victim_name} {patronymic}. Служба безопасности {bank}, меня зовут {agent_name}."
          - "Добрый день. Это {bank}, отдел противодействия мошенничеству. Вам удобно говорить?"
          - "{victim_name} {patronymic}, здравствуйте. Звоню из службы финансовой безопасности {bank}."
        kk:
          - "Сәлеметсіз бе, {victim_name}. {bank} қауіпсіздік қызметінен {agent_name} мазалап тұр."
          - "Қайырлы күн. Бұл {bank}, алаяқтыққа қарсы бөлім. Сөйлесуге ыңғайлы ма?"
      intent: "представиться сотрудником авторитетной организации"
    S1:
      caller:
        ru:
          - "Для верификации: ваша карта оканчивается на {card_last4}, верно?"
          - "Вы {victim_name} {patronymic}, {city}, обслуживаетесь у нас с прошлого года — подтверждаете?"
          - "Номер обращения {case_number}, он зафиксирован в системе."
        kk:
          - "Растау үшін: картаңыздың соңғы сандары {card_last4}, дұрыс па?"
          - "Сіз {victim_name}, {city} тұрғынысыз — растайсыз ба?"
      intent: "продемонстрировать осведомлённость, снять первичное недоверие"
    S2:
      caller:
        ru:
          - "В {city} только что подана заявка на кредит {loan_amount} тенге на ваше имя."
          - "С вашего счёта пытаются списать {amount_medium} тенге. Операция ещё не подтверждена."
          - "Зафиксирован вход в ваш личный кабинет с другого устройства."
          - "На вас оформляют кредит. Если не остановим сейчас, деньги уйдут и долг останется на вас."
        kk:
          - "{city} қаласында сіздің атыңызға {loan_amount} теңге несиеге өтінім түсті."
          - "Шотыңыздан {amount_medium} теңге алуға әрекет жасалып жатыр."
          - "Сіздің атыңызға несие ресімделуде. Қазір тоқтатпасақ, қарыз сізге қалады."
      intent: "создать угрозу, вызвать панику"
    S3:
      caller:
        ru:
          - "Ни в коем случае не кладите трубку — линия должна оставаться открытой."
          - "У нас {time_pressure_window}, потом операция уйдёт в обработку."
          - "Никому не сообщайте о разговоре, идёт оперативная проверка."
          - "Не перезванивайте в отделение, там сидит тот, кто сливает данные."
          - "Если положите трубку, мы не сможем заблокировать перевод."
        kk:
          - "Ешқандай жағдайда телефонды қоймаңыз, желі ашық тұруы керек."
          - "Бізде {time_pressure_window} уақыт бар."
          - "Бұл әңгіме туралы ешкімге айтпаңыз, тексеру жүріп жатыр."
      intent: "изолировать от внешней проверки, лишить времени на размышление"
    S4:
      caller:
        ru:
          - "Соединяю вас со следователем {authority}, он ведёт ваше дело."
          - "{victim_name} {patronymic}, это старший лейтенант {agent_name}, {authority}. Дело {case_number}."
          - "Мы фиксируем организованную группу, вы проходите как потерпевший."
          - "Сейчас с вами будет говорить специалист {authority}, он подтвердит мои слова."
        kk:
          - "Сізді {authority} тергеушісімен байланыстырамын."
          - "Бұл {authority} қызметкері {agent_name}, іс нөмірі {case_number}."
      intent: "усилить авторитет, подключить второго актёра"
    S5:
      caller:
        ru:
          - "Чтобы заблокировать заявку, продиктуйте код из SMS — он только что пришёл."
          - "Переведите остаток на безопасный счёт, реквизиты сейчас продиктую."
          - "Нужно оформить встречный кредит на ту же сумму — так заявка аннулируется."
          - "Снимите наличные и внесите через банкомат на резервный счёт {case_number}."
          - "Код никому не передавайте, кроме меня — я сотрудник банка, мне можно."
        kk:
          - "Өтінімді бұғаттау үшін SMS-тен келген кодты айтыңыз."
          - "Қалған қаражатты қауіпсіз шотқа аударыңыз, деректемелерді қазір айтамын."
          - "Қолма-қол ақша алып, банкомат арқылы резервтік шотқа салыңыз."
      intent: "получить целевое действие — точка невозврата"
    S6:
      caller:
        ru:
          - "Перевод прошёл. Есть ещё счета в других банках? Их тоже нужно защитить."
          - "В ближайшие сутки вам могут позвонить якобы из банка — не отвечайте."
          - "Заявление писать не нужно, мы сами передадим материалы."
        kk:
          - "Аударым өтті. Басқа банкте шотыңыз бар ма?"
          - "Жақын арада банк атынан қоңырау шалуы мүмкін — жауап бермеңіз."
      intent: "закрепить результат, повторный заход, удержать от обращения в банк"

  # ═══════════════════════════════════════════════════════════════════
  SC02:  # Оператор связи / eGov — сбор SMS-кода
    S0:
      caller:
        ru:
          - "Здравствуйте, {telecom}, абонентский отдел."
          - "Добрый день, это техподдержка {telecom}."
        kk:
          - "Сәлеметсіз бе, {telecom} абоненттік бөлімі."
      intent: "представиться оператором связи или госпорталом"
    S1:
      caller:
        ru:
          - "Ваш номер зарегистрирован на {victim_name} {patronymic}, верно?"
          - "Договор обслуживания у вас с {city}, всё верно?"
        kk:
          - "Нөміріңіз {victim_name} атына тіркелген, дұрыс па?"
      intent: "подтвердить осведомлённость"
    S2:
      caller:
        ru:
          - "Срок действия договора на SIM-карту истекает, нужно продлить дистанционно."
          - "Иначе номер будет отключён в течение суток и передан другому абоненту."
          - "Требуется переоформление услуг, иначе доступ к {gov_org} будет закрыт."
        kk:
          - "SIM-картаға арналған шарттың мерзімі бітуде, қашықтан ұзарту керек."
          - "Әйтпесе нөмір тәулік ішінде өшіріледі."
      intent: "создать предлог, требующий действия"
    S5:
      caller:
        ru:
          - "Для продления продиктуйте код, который сейчас придёт в SMS."
          - "Назовите четыре цифры из сообщения — это стандартная процедура подтверждения."
          - "Код пришёл? Продиктуйте, и договор продлится автоматически."
        kk:
          - "Ұзарту үшін SMS-ке келетін кодты айтыңыз."
          - "Хабарламадағы төрт санды айтыңыз, бұл стандартты рәсім."
      intent: "получить SMS-код"

  # ═══════════════════════════════════════════════════════════════════
  SC03:  # SMS-бомбинг + «Антиспам»
    S0:
      caller:
        ru:
          - "Здравствуйте, техническая поддержка {telecom}, специалист {agent_name}."
          - "Добрый день, отдел безопасности {telecom}."
        kk:
          - "Сәлеметсіз бе, {telecom} техникалық қолдау қызметі."
      intent: "представиться техподдержкой"
    S1:
      caller:
        ru:
          - "Мы видим, что на ваш номер за последние минуты пришло больше сотни сообщений."
          - "Вы ведь получаете сейчас шквал SMS? Это видно в нашей системе."
        kk:
          - "Соңғы минуттарда нөміріңізге жүзден астам хабарлама келгенін көріп тұрмыз."
      intent: "сослаться на реальное наблюдаемое событие"
    S2:
      caller:
        ru:
          - "Фиксируем массовую SMS-атаку на ваш аккаунт, это попытка взлома."
          - "Рекомендуем срочно активировать защиту «Антиспам», иначе доступ перехватят."
        kk:
          - "Аккаунтыңызға жаппай SMS-шабуыл тіркеліп жатыр."
          - "«Антиспам» қорғанысын шұғыл қосуды ұсынамыз."
      intent: "переопределить реальный сигнал как угрозу"
    S3:
      caller:
        ru:
          - "Атака продолжается прямо сейчас, нужно успеть до её завершения."
          - "Оставайтесь на линии, иначе защиту не подключим."
        kk:
          - "Шабуыл дәл қазір жалғасуда, үлгеру керек."
      intent: "давление временем"
    S5:
      caller:
        ru:
          - "Чтобы подключить «Антиспам», назовите последний пришедший код."
          - "Продиктуйте код из сообщения — он техническим, не финансовый."
        kk:
          - "«Антиспам» қосу үшін соңғы келген кодты айтыңыз."
      intent: "получить SMS-код под видом технической операции"

  # ═══════════════════════════════════════════════════════════════════
  SC04:  # ЕНПФ — перерасчёт пенсии
    S0:
      caller:
        ru:
          - "Здравствуйте, {victim_name} {patronymic}. Это {pension_fund}, специалист {agent_name}."
          - "Добрый день, звоню из пенсионного фонда по вашему делу."
        kk:
          - "Сәлеметсіз бе, {victim_name}. Бұл {pension_fund}, маман {agent_name}."
          - "Қайырлы күн, зейнетақы қорынан хабарласып тұрмын."
      intent: "представиться сотрудником пенсионного фонда"
    S1:
      caller:
        ru:
          - "Наше отделение в {city}, {district} — можете проверить адрес на сайте."
          - "Ваш ИИН у меня в карточке, {victim_name} {patronymic}, год рождения подтверждаете?"
        kk:
          - "Біздің бөлім {city} қаласында, мекенжайды сайттан тексере аласыз."
      intent: "назвать реальный адрес для правдоподобия"
    S2:
      caller:
        ru:
          - "При проверке обнаружены годы стажа, не вошедшие в расчёт вашей пенсии."
          - "Вам положен перерасчёт и доплата около {amount_medium} тенге."
          - "Средства нужно оформить до конца квартала, иначе перерасчёт сгорит."
        kk:
          - "Тексеру кезінде есепке алынбаған еңбек өтіліңіз анықталды."
          - "Сізге қайта есептеу және шамамен {amount_medium} теңге қосымша төлем тиесілі."
      intent: "предложить выгоду, снизить критичность"
    S5:
      caller:
        ru:
          - "Забронируем электронную очередь — продиктуйте код подтверждения из SMS."
          - "Для идентификации назовите четыре цифры, которые пришли сообщением."
        kk:
          - "Электрондық кезекке жазылу үшін SMS-тегі растау кодын айтыңыз."
          - "Сәйкестендіру үшін хабарламадағы төрт санды айтыңыз."
      intent: "получить SMS-код"

  # ═══════════════════════════════════════════════════════════════════
  SC05:  # Фейковые инвестиции
    S0:
      caller:
        ru:
          - "Здравствуйте! {agent_name}, персональный инвестиционный консультант."
          - "Добрый день, вы оставляли заявку на нашей платформе, верно?"
        kk:
          - "Сәлеметсіз бе! {agent_name}, жеке инвестициялық кеңесші."
      intent: "представиться консультантом"
    S1:
      caller:
        ru:
          - "Мы работаем с клиентами из {city} уже четыре года, отзывы есть в интернете."
          - "Наши клиенты в среднем выходят на {return_promise}."
        kk:
          - "Біз {city} қаласындағы клиенттермен төрт жыл жұмыс істеп келеміз."
      intent: "создать видимость репутации"
    S2:
      caller:
        ru:
          - "Открыт доступ к закрытой площадке: {investment_asset}, доходность {return_promise}."
          - "Риска практически нет, площадка страхует депозит."
          - "Доход гарантирован — мы работаем по алгоритму, он не ошибается."
        kk:
          - "Жабық алаңға қолжетімділік ашылды: {investment_asset}, кірістілік {return_promise}."
          - "Тәуекел жоқ, алаң депозитті сақтандырады."
      intent: "обещать доход без риска"
    S3:
      caller:
        ru:
          - "Мест осталось немного, набор закрываем сегодня до {time_pressure_window}."
          - "Завтра условия будут хуже, сейчас действует специальная ставка."
        kk:
          - "Орын аз қалды, бүгін жабамыз."
      intent: "искусственный дефицит"
    S5:
      caller:
        ru:
          - "Начните с минимального депозита {amount_medium} тенге, дальше только растёт."
          - "Установите наше приложение — там ваш торговый кабинет."
          - "Переведите на реквизиты, я продиктую, счёт партнёрский."
        kk:
          - "Ең төменгі депозиттен бастаңыз — {amount_medium} теңге."
          - "Біздің қосымшаны орнатыңыз, ол жерде сауда кабинетіңіз болады."
      intent: "получить первый перевод"
    S6:
      caller:
        ru:
          - "Прибыль {amount_large} тенге на счету. Для вывода нужно оплатить налог {amount_medium}."
          - "Система требует подтверждающий взнос, после него выведем всю сумму."
          - "Не выводите сейчас, через неделю сумма удвоится."
        kk:
          - "Пайда {amount_large} теңге. Шығару үшін {amount_medium} салық төлеу керек."
          - "Жүйе растау жарнасын талап етеді."
      intent: "ловушка вывода — повторные платежи"

  # ═══════════════════════════════════════════════════════════════════
  SC06:  # Одобренный кредит + фишинговая ссылка (v2: звонок; приветствие — общий пул темы «кредит»)
    S2:
      caller:
        ru:
          - "Вам пришло SMS «{bank}: заявка на кредит {loan_amount} тг одобрена. Подтвердите: {link}»?"
          - "Если это были не вы, отмените заявку по ссылке {link} в течение {time_pressure_window}."
          - "Без подтверждения средства будут зачислены автоматически."
        kk:
          - "Сізге «{bank}: {loan_amount} тг несиеге өтінім мақұлданды. Растаңыз: {link}» деген SMS келді ме?"
          - "Егер бұл сіз болмасаңыз, сілтеме арқылы өтінімді тоқтатыңыз."
      intent: "подтолкнуть к переходу по ссылке"
    S5:
      caller:
        ru:
          - "Введите номер удостоверения личности и данные карты для отмены."
          - "Укажите код подтверждения из SMS на странице отмены."
          - "Для идентификации введите ИИН и срок действия карты."
        kk:
          - "Болдырмау үшін жеке куәлік нөмірі мен карта деректерін енгізіңіз."
          - "SMS-тегі растау кодын бетте көрсетіңіз."
      intent: "сбор реквизитов на фишинговой странице"

  # ═══════════════════════════════════════════════════════════════════
  SC07:  # Удалённый доступ
    S0:
      caller:
        ru:
          - "Здравствуйте, {telecom}, технический специалист {agent_name}."
          - "Добрый день, техподдержка {bank}, обращение {case_number}."
        kk:
          - "Сәлеметсіз бе, {telecom} техникалық маманы."
      intent: "представиться техподдержкой"
    S1:
      caller:
        ru:
          - "Вижу ваш договор, {city}, подключены интернет и телевидение."
          - "По вашему обращению {case_number} назначен специалист, это я."
        kk:
          - "Шартыңызды көріп тұрмын, {city}."
      intent: "правдоподобие через технические детали"
    S2:
      caller:
        ru:
          - "Для вашего номера действует скидка 30% на подключение телеканалов."
          - "В приложении банка обнаружен сбой, из-за него возможно двойное списание."
          - "Нужно проверить настройки устройства, иначе доступ будет ограничен."
        kk:
          - "Сіздің нөміріңізге телеарналарға 30% жеңілдік бар."
          - "Банк қосымшасында ақау анықталды."
      intent: "предлог для доступа к устройству"
    S5:
      caller:
        ru:
          - "Установите из маркета {app_name} — это официальная программа поддержки."
          - "Откройте приложение и продиктуйте девятизначный номер с экрана."
          - "Включите демонстрацию экрана, я подскажу, куда нажимать."
          - "Не закрывайте приложение, я сейчас настрою, ничего не трогайте."
        kk:
          - "{app_name} қосымшасын орнатыңыз, бұл ресми бағдарлама."
          - "Экранды көрсетуді қосыңыз, қайда басу керегін айтамын."
      intent: "захват устройства"
    S6:
      caller:
        ru:
