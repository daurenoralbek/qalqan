# Қалқан — таксономия ЛЕГИТИМНЫХ звонков (контрольный класс)
#
# Зачем это важнее, чем кажется:
# детектор, обученный только на мошенничестве, ловит «разговор про деньги»,
# а не «мошенничество». ScriptMind (arXiv:2601.13581) снизил false positive rate
# с 0.24 до 0.02 именно за счёт трудных негативов.
#
# Каждый сценарий ниже намеренно ДЕЛИТ поверхностные признаки с мошенническими:
# деньги, срочность, авторитет, персональные данные — но не содержит красных флагов.

schema_version: "1.0"

benign_scenarios:

  - id: BN01
    code: real_bank_verification
    name_ru: "Настоящий банк подтверждает операцию"
    name_kk: "Нағыз банк операцияны растайды"
    difficulty: hard
    shares_with_scam: [S0, S1, S2]
    shares_surface_features: [authority, suspicious_transaction_mention, personal_data]
    distinguishing_behavior:
      - "НЕ просит назвать код из SMS — просит подтвердить «да/нет»"
      - "НЕ предлагает никуда переводить деньги"
      - "Спокойно предлагает перезвонить на номер с обратной стороны карты"
      - "Не возражает, если клиент кладёт трубку и перезванивает сам"
    example_turns_ru:
      - "Зафиксирована операция на 250 000 тенге в интернет-магазине. Вы её совершали?"
      - "Если это не вы, я блокирую карту прямо сейчас, перевыпуск займёт три дня."
      - "Можете положить трубку и перезвонить нам по номеру на обороте карты."
    label: benign

  - id: BN02
    code: real_relative_asks_money
    name_ru: "Родственник действительно просит денег"
    name_kk: "Туысы шынымен ақша сұрайды"
    difficulty: very_hard
    shares_with_scam: [S2, S3, S5]
    shares_surface_features: [emotional_urgency, money_request, personal_relationship]
    distinguishing_behavior:
      - "Готов ответить на личные вопросы, не паникует от проверки"
      - "Не запрещает рассказывать другим членам семьи"
      - "Можно перезвонить на известный номер — и он ответит"
      - "Просьба вписана в известный контекст (учёба, ремонт, лечение)"
    example_turns_ru:
      - "Аға, у меня оплата за общагу горит, можешь 40 тысяч кинуть до стипендии?"
      - "Позвони маме, она в курсе, я ей вчера говорил."
      - "Да я тебе на Kaspi скину скрин квитанции, посмотри."
    label: benign
    note: "Ключевой негатив против SC08 (клонированный голос). Модель обязана их различать."

  - id: BN03
    code: real_delivery_courier
    name_ru: "Курьер службы доставки"
    difficulty: medium
    shares_surface_features: [time_pressure, personal_data, code_mention]
    distinguishing_behavior:
      - "Код называет САМ курьер клиенту (а не наоборот)"
      - "Речь о физической посылке, не о счетах"
    example_turns_ru:
      - "Я у подъезда, код для получения 4471, спуститесь?"
      - "Могу оставить у консьержа, если вам неудобно."
    label: benign

  - id: BN04
    code: real_debt_collector
    name_ru: "Взыскание по реальной просрочке"
    difficulty: hard
    shares_surface_features: [authority, pressure, legal_threat, money]
    distinguishing_behavior:
      - "Ссылается на реальный существующий договор с номером"
      - "Требует платить по официальным реквизитам банка, не на «безопасный счёт»"
      - "Не просит коды, не просит устанавливать приложения"
    example_turns_ru:
      - "По договору 4417-КР просрочка 42 дня, сумма 186 400 тенге."
      - "Оплатить можно в приложении банка или в любом отделении."
      - "Если не погасите, дело уйдёт в суд — это официальная процедура."
    label: benign
    note: "Давление есть, но легитимное. Обучает модель не путать давление с мошенничеством."

  - id: BN05
    code: real_telecom_offer
    name_ru: "Оператор связи предлагает тариф"
    difficulty: medium
    shares_surface_features: [telecom_authority, discount_offer]
    distinguishing_behavior:
      - "Не просит код, подтверждение делается в личном кабинете самим абонентом"
      - "Спокойно принимает отказ"
    example_turns_ru:
      - "Для вашего номера доступен тариф на 20% дешевле текущего."
      - "Подключить можно самому в приложении, никаких кодов диктовать не нужно."
      - "Хорошо, не буду настаивать, хорошего дня."
    label: benign

  - id: BN06
    code: real_clinic_appointment
    name_ru: "Поликлиника подтверждает запись"
    difficulty: medium
    shares_surface_features: [government_authority, personal_data]
    distinguishing_behavior:
      - "Не запрашивает SMS-коды и финансовые данные"
    example_turns_ru:
      - "Подтверждаю вашу запись к терапевту на четверг, 10:20."
      - "Возьмите удостоверение личности, этого достаточно."
    label: benign

  - id: BN07
    code: real_licensed_broker
    name_ru: "Лицензированный брокер / инвестконсультант"
    difficulty: hard
    shares_with_scam: [S0, S1]
    shares_surface_features: [investment_topic, returns_discussion]
    distinguishing_behavior:
      - "Прямо проговаривает риски и отсутствие гарантий"
      - "Ссылается на лицензию и регулятора"
      - "Не требует срочности, предлагает изучить документы"
    example_turns_ru:
      - "Доходность историческая, она ничего не гарантирует на будущее."
      - "Мы под надзором регулятора, номер лицензии есть на сайте."
      - "Не торопитесь, изучите проспект, свяжемся на следующей неделе."
    label: benign
    note: "Критично: иначе модель научится считать слово «инвестиции» признаком скама."

  - id: BN08
    code: real_employer_hr
    name_ru: "Работодатель / HR о выплатах"
    difficulty: medium
    shares_surface_features: [authority, money, urgency]
    distinguishing_behavior:
      - "Не просит переводить деньги, речь о получении"
      - "Реквизиты запрашивает через официальный канал, не по телефону"
    example_turns_ru:
      - "Нужно уточнить ваш ИИН для ведомости, отправьте через корпоративную почту."
      - "Зарплату проведём в пятницу, как обычно."
    label: benign

  - id: BN09
    code: real_telecom_security_notice
    name_ru: "Оператор связи: настоящее уведомление о безопасности номера"
    difficulty: hard
    added_in: "v2"
    pair_for: SC03
    shares_surface_features: [authority, sms_flood_mention, code_mention, urgency]
    distinguishing_behavior:
      - "Сам предупреждает: коды никому не называть, в том числе ему"
      - "Ничего не подтверждает по телефону — только «да/нет» и визит в салон"
      - "Предлагает перезвонить на короткий номер оператора с сайта"
    example_turns_ru:
      - "В салоне подали заявку на замену вашей SIM-карты. Это были вы?"
      - "Никому не сообщайте коды из этих SMS — ни нам, ни банку."
    label: benign

  - id: BN10
    code: real_pension_info_call
    name_ru: "Пенсия и госуслуги: настоящий информационный звонок (ЕНПФ / ЦОН)"
    difficulty: hard
    added_in: "v2"
    pair_for: SC04
    shares_surface_features: [authority, benefit_mention, work_record, deadline]
    distinguishing_behavior:
      - "Только информирует, оформление — через eGov или лично в ЦОНе"
      - "Прямо говорит, что коды и пароли не спрашивает"
    example_turns_ru:
      - "Заявление рассмотрено, выписку можно посмотреть в eGov."
      - "Вам положен перерасчёт — подайте заявление через eGov, по телефону мы ничего не оформляем."
    label: benign

  - id: BN11
    code: real_tech_support_callback
    name_ru: "Техподдержка по заявке самого клиента"
    difficulty: hard
    added_in: "v2"
    pair_for: SC07
    shares_surface_features: [tech_support, keep_line_open, screen_share_mention, device_instructions]
    distinguishing_behavior:
      - "Звонок по заявке, которую клиент оставил сам"
      - "Не просит устанавливать сторонние программы удалённого доступа"
      - "Все действия клиент выполняет сам, коды не запрашиваются"
    example_turns_ru:
      - "Не кладите трубку, я проверю линию с нашей стороны."
      - "Удалённо к вашему телефону я не подключаюсь, всё делаете вы сами."
    label: benign

# Целевое соотношение в корпусе
corpus_balance:
  scam_share: 0.5
  benign_share: 0.5
  # v2: диалог порождается «тема → класс → сценарий» (topics.yaml), поэтому
  # доля трудных негативов определяется составом тем, а не отдельной квотой
  sampling: topic_first
  hard_negative_share_within_benign: 0.6   # используется только в режиме v1
  rationale: >
    v1: половина негативов — трудные (BN01, BN02, BN04, BN07).
    v2: у каждой темы есть и мошеннический, и легитимный сценарий, тема
    выбирается независимо от класса — иначе модель учит тему, а не приём
    манипуляции (см. topics.yaml и results/detector_eval_*).
